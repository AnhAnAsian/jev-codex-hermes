name: Public checkout smoke
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Public branch or tag to test (live client checks remain manual)
        required: true
        default: main
        type: string
permissions:
  contents: read
jobs:
  checkout-smoke:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Test an anonymous public checkout without installing a live service
        env:
          SMOKE_REF: ${{ inputs.ref }}
        run: python3 scripts/check-public-checkout.py --ref "$SMOKE_REF"
