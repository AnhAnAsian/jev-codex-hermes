<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-labelledby="title desc">
  <title id="title">Jev for Codex &amp; Hermes — let the task choose the model</title>
  <desc id="desc">A local routing diagram: one task is classified into FAST, BALANCED, STRONG or LONG, then the chosen model is pinned. The highlighted balanced path is an illustration.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#e1dceb" stroke-width="1"/></pattern>
  </defs>
  <rect width="1280" height="440" rx="20" fill="#f4f2f8"/>
  <rect x="670" y="28" width="582" height="354" rx="16" fill="url(#grid)"/>
  <path d="M48 380H1232" stroke="#d8d1e4"/>
  <g font-family="Avenir Next,Segoe UI,Arial,sans-serif">
    <text x="48" y="66" font-size="22" font-weight="800" letter-spacing="4" fill="#54438f">JEV</text>
    <text x="124" y="64" font-size="14" font-weight="600" letter-spacing="1" fill="#766789">LOCAL MODEL ROUTER</text>
    <g font-size="64" font-weight="800" letter-spacing="-2" fill="#30264f">
      <text x="44" y="160">Let the task</text>
      <text x="44" y="229">choose the model.</text>
    </g>
    <text x="48" y="285" font-size="21" fill="#665977">Codex Desktop + first-party Hermes</text>
    <text x="48" y="320" font-size="18" fill="#665977">Your login. Your tools. A choice that stays.</text>
    <text x="48" y="414" font-size="14" fill="#766789">CLASSIFY  →  CHOOSE  →  PIN</text>
    <text x="1052" y="414" font-size="14" fill="#766789">127.0.0.1 only</text>
  </g>
  <g fill="none" stroke-linecap="round" stroke-width="3">
    <path d="M708 219H754Q780 219 780 193V103Q780 87 804 87H905" stroke="#c5b9da"/>
    <path d="M708 219H754Q795 219 795 184Q795 157 825 157H905" stroke="#167c7f" stroke-width="5"/>
    <path d="M708 219H830Q850 219 850 227H905" stroke="#c5b9da"/>
    <path d="M708 219H754Q780 219 780 245V281Q780 297 804 297H905" stroke="#c5b9da"/>
    <path d="M1038 157H1095Q1115 157 1115 181V206" stroke="#167c7f" stroke-width="5"/>
  </g>
  <circle cx="708" cy="219" r="10" fill="#54438f"/>
  <g font-family="Avenir Next,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700">
    <text x="696" y="252" fill="#766789">TASK</text>
    <rect x="898" y="67" width="140" height="40" rx="10" fill="#e9e3f0"/><text x="920" y="92" fill="#766789">FAST</text>
    <rect x="898" y="137" width="140" height="40" rx="10" fill="#167c7f"/><text x="914" y="162" fill="#fff">BALANCED</text>
    <rect x="898" y="207" width="140" height="40" rx="10" fill="#e9e3f0"/><text x="920" y="232" fill="#766789">STRONG</text>
    <rect x="898" y="277" width="140" height="40" rx="10" fill="#e9e3f0"/><text x="920" y="302" fill="#766789">LONG</text>
    <rect x="1070" y="211" width="126" height="78" rx="12" fill="#fff" stroke="#b4d3d2"/>
    <text x="1087" y="242" fill="#167c7f">CHOSEN</text><text x="1087" y="264" fill="#167c7f">&amp; PINNED</text>
    <text x="898" y="353" font-size="12" font-weight="500" fill="#766789">Illustrated routing decision</text>
  </g>
</svg>
